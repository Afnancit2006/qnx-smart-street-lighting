name: Host baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show compiler
        run: g++ --version

      - name: Build with warnings as errors
        run: make

      - name: Run unit and multi-process integration tests
        run: make check

      - name: Upload test evidence when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-evidence
          path: run/integration-test/
          if-no-files-found: ignore
